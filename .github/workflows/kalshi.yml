name: Kalshi-sentiment

# Egen jobb for Kalshi-fanen. Den rører ikke ksig, data/, state/ eller results/,
# og den feiler uten å påvirke de daglige signalene.
#
# Hver kveld kl. 23:40 UTC tas et øyeblikksbilde av Kalshis BTC-markeder.
# Siden kalshi/public/ publiseres sammen med resten av nettsiden når
# «Daglige signaler» kjører kl. 00:35 UTC. Ved manuell kjøring kan du velge
# å publisere med en gang.

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Hva skal kjøres"
        type: choice
        options: [snapshot, build, backfill]
        default: snapshot
      since:
        description: "Kun for backfill: første dato (ÅÅÅÅ-MM-DD)"
        type: string
        default: ""
      publish:
        description: "Publiser nettsiden med en gang (kjører «Daglige signaler» i build-modus)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-sentiment
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kalshi/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r kalshi/requirements.txt

      - name: Kjør
        env:
          MODE: ${{ github.event_name == 'schedule' && 'snapshot' || inputs.mode }}
          SINCE: ${{ inputs.since }}
        run: |
          set -e
          echo "Modus: $MODE"
          case "$MODE" in
            snapshot) python -m kalshi snapshot ;;
            build)    python -m kalshi build ;;
            backfill)
              if [ -z "$SINCE" ]; then echo "Backfill krever 'since'"; exit 1; fi
              python -m kalshi backfill --since "$SINCE" ;;
          esac

      - name: Lagre øyeblikksbilder og side
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalshi/data kalshi/public
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Kalshi-sentiment $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Publiser nettsiden
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref "${{ github.ref_name }}" -f mode=build
