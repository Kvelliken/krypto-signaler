# =============================================================================
# Krypto-signaler – konfigurasjon
# Endringer her slår inn ved neste kjøring på GitHub.
# =============================================================================

pages_url = "https://kvelliken.github.io/krypto-signaler/"
data_start = "2014-01-01"   # Henter så langt tilbake som kilden har data

# -----------------------------------------------------------------------------
# Coins og strategi per coin
# Valgt etter søk over 320 varianter i 7 familier (se research/search.py og
# research/classic.py). Krav: slå kjøp og hold på avkastning både før og etter
# oktober 2024, med mindre fall, og med nabo-parametere som også holder.
# -----------------------------------------------------------------------------
[[assets]]
symbol = "BTC-USD"
short = "BTC"
name = "Bitcoin"
strategy = { type = "sma_band", n = 150, band = 0.02, check = "daily" }

[[assets]]
symbol = "ETH-USD"
short = "ETH"
name = "Ethereum"
# Spesifikasjon: dokumentet "ETH-strategi: design og spesifikasjon" og research/eth_design.py
strategy = { type = "ens_regime", set = "middels", regime = "BTC-USD", regime_set = "middels", check = "weekly" }

[[assets]]
symbol = "SOL-USD"
short = "SOL"
name = "Solana"
# Spesifikasjon: dokumentet "SOL-strategi: design og spesifikasjon" og research/sol_design.py
# H2 valgt fremfor H1 fordi den hadde minst fall i de rettferdige testene (mål: unngå store fall)
strategy = { type = "ens_regime", set = "lang", regime = "ETH-USD", regime_set = "lang", check = "weekly" }

# -----------------------------------------------------------------------------
# Fordeling av hele porteføljen mellom coinene (se research/portfolio_design.py)
# Hver søndag rangeres coinene etter avkastning siste 90 døgn og får vekt 50/30/20.
# Andel av porteføljen = vekt × coinens målandel fra regelen over. Resten er kontanter.
# -----------------------------------------------------------------------------
[portfolio]
method = "momentum"
mom_window = 90
weights = [0.5, 0.3, 0.2]
band = 0.05          # Varsle/handle en coin bare når andelen endres minst 5 prosentpoeng (eller til/fra 0)
round_to = 0.025     # Andeler avrundes til nærmeste 2,5 %

# -----------------------------------------------------------------------------
# Kostnader og utførelse (Firi)
# -----------------------------------------------------------------------------
[costs]
fee = 0.007          # Firi handelsgebyr 0,7 %
slippage = 0.003     # Påslag i kurs / spread, anslått 0,3 %
lag_days = 1         # 1 = handler rett etter døgnslutt (00:00 UTC)
                     # 2 = handler et døgn for sent

# -----------------------------------------------------------------------------
# Analyse
# -----------------------------------------------------------------------------
[research]
eval_warmup_days = 366         # Felles start: etter oppvarming for alle testede familier
holdout_start = "2024-10-16"   # Data fra og med denne datoen ble ikke brukt til første utvalg
cost_levels = [0.005, 0.01, 0.015, 0.02, 0.03]
lag_days = [1, 2, 3]
bootstrap_block_days = 60
bootstrap_samples = 2000

# -----------------------------------------------------------------------------
# Varsler
# -----------------------------------------------------------------------------
[alerts]
near_pct = 0.03          # Merk "nær signal" når prisen er innenfor 3 % av en grense
stale_after_days = 2     # Varsle hvis siste data er eldre enn dette
